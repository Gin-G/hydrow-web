<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydrow Rower · Profile</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='hydrow.css') }}">
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/" style="text-decoration: none;">Hydrow</a>
  <div class="topbar-right">
    <a href="javascript:history.back()" class="logout-btn">← Back</a>
    <button class="logout-btn" onclick="doLogout()">Sign out</button>
  </div>
</div>

<div class="main">
  <div id="profile-card"><div class="loading">Loading profile…</div></div>

  <p class="section-label">Recent activity</p>
  <div id="rower-feed" class="workout-list"><div class="loading">Loading workouts…</div></div>
</div>

<script>
const API = '/api';
const SCREEN_NAME = {{ screen_name|tojson }};
const SCREEN_NAME_ENC = encodeURIComponent(SCREEN_NAME);

const DEFAULT_AVATAR =
  'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="16" fill="#0d5470"/>
      <circle cx="16" cy="13" r="5" fill="#4d8fa6"/>
      <path d="M6 28c0-5.5 4.5-9 10-9s10 3.5 10 9" fill="#4d8fa6"/>
    </svg>`
  );

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtSplit(s) {
  if (s == null) return '—';
  const total = Number(s);
  if (!isFinite(total)) return s;
  const m = Math.floor(total / 60);
  const sec = (total - m * 60).toFixed(1).padStart(4, '0');
  return `${m}:${sec}`;
}

async function doLogout() {
  await fetch(`${API}/logout`, { method: 'POST' });
  location.href = '/';
}

function renderProfile(p) {
  const bits = [
    p.location && p.location.trim(),
    p.ageDecade ? `${p.ageDecade}s` : null,
    p.gender,
  ].filter(Boolean);
  const avatar = p.profileImageUrl512 || DEFAULT_AVATAR;
  document.getElementById('profile-card').innerHTML = `
    <div class="profile-card">
      <img class="profile-avatar" src="${avatar}" alt="" onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}'">
      <div class="profile-text">
        <h1 class="profile-name">${p.screenName || SCREEN_NAME}</h1>
        <div class="profile-meta">${bits.join(' · ') || '—'}</div>
        ${p.aboutMe ? `<p class="profile-about">${p.aboutMe}</p>` : ''}
      </div>
    </div>
  `;
}

function posterFromImage(img, w = 1280, h = 720) {
  if (!img?.imageServerBaseUrl || !img?.bucket || !img?.key) return '';
  const spec = { bucket: img.bucket, key: img.key, edits: { resize: { width: w, height: h } } };
  return `${img.imageServerBaseUrl}/${btoa(JSON.stringify(spec))}`;
}

function renderFeed(items) {
  const workouts = items.filter(i => i.workoutVideo && i.stats);
  if (!workouts.length) {
    document.getElementById('rower-feed').innerHTML =
      '<div class="loading">No workouts to show.</div>';
    return;
  }
  document.getElementById('rower-feed').innerHTML = workouts.map(i => {
    const v = i.workoutVideo || {};
    const s = i.stats || {};
    const r = s.rowerStats || {};
    const meters = r.meters != null ? Math.round(Number(r.meters)).toLocaleString() : '—';
    const split  = fmtSplit(r.splitTime);
    const instructor = v.athlete?.familiarName || v.athlete?.name || '';
    const meta = [fmtDate(s.startTime), instructor, v.locationShortName].filter(Boolean).join(' · ');
    const posterUri = posterFromImage(v.image);
    const poster = posterUri
      ? `<img class="workout-poster" src="${posterUri}" alt="" loading="lazy">`
      : '';
    return `
      <div class="workout-row">
        <div class="workout-header">
          <div class="workout-header-text">
            <div class="workout-name">${v.name || 'Workout'}</div>
            <div class="workout-meta">${meta}</div>
          </div>
        </div>
        ${poster}
        <div class="workout-stats">
          <div class="ws"><div class="ws-val">${meters}</div><div class="ws-lbl">Total meters</div></div>
          <div class="ws"><div class="ws-val">${split}</div><div class="ws-lbl">Avg /500m split</div></div>
        </div>
      </div>`;
  }).join('');
}

async function load() {
  try {
    const [pResp, fResp] = await Promise.all([
      fetch(`${API}/profile/${SCREEN_NAME_ENC}`),
      fetch(`${API}/profile/${SCREEN_NAME_ENC}/feed`),
    ]);
    if (pResp.status === 401) { location.href = '/'; return; }

    if (pResp.ok) {
      renderProfile(await pResp.json());
    } else {
      const err = await pResp.json().catch(() => ({}));
      document.getElementById('profile-card').innerHTML =
        `<div class="error-msg">Profile unavailable: ${err.error || pResp.status}</div>`;
    }

    if (fResp.ok) {
      renderFeed(await fResp.json());
    } else {
      const err = await fResp.json().catch(() => ({}));
      document.getElementById('rower-feed').innerHTML =
        `<div class="error-msg">Workouts unavailable: ${err.error || fResp.status}</div>`;
    }
  } catch (e) {
    document.getElementById('rower-feed').innerHTML =
      `<div class="error-msg">Failed to load: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
