<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydrow Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.09);
    --border2: rgba(0,0,0,0.15);
    --text: #1a1a18;
    --muted: #6b6b67;
    --hint: #a0a09a;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --teal-dark: #0F6E56;
    --coral: #D85A30;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --chart-grid: rgba(0,0,0,0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #242422;
      --surface2: #2e2e2b;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #f0efe9;
      --muted: #9a9a94;
      --hint: #6b6b67;
      --teal-light: #0a3326;
      --teal-dark: #5DCAA5;
      --amber-light: #3a2a06;
      --blue-light: #0c2847;
      --chart-grid: rgba(255,255,255,0.06);
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
  }

  /* ── Login ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 360px;
  }

  .login-logo {
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--teal);
    font-family: 'Courier New', monospace;
    margin-bottom: 1.5rem;
  }

  .login-heading {
    font-size: 26px;
    font-weight: normal;
    line-height: 1.3;
    margin-bottom: .4rem;
  }

  .login-sub {
    font-size: 14px;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    margin-bottom: 2rem;
  }

  .field { margin-bottom: 1rem; }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    color: var(--text);
    font-family: -apple-system, sans-serif;
    outline: none;
    transition: border-color .15s;
  }

  .field input:focus { border-color: var(--teal); }

  .login-btn {
    width: 100%;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    cursor: pointer;
    margin-top: .5rem;
    transition: opacity .15s;
  }

  .login-btn:hover { opacity: .88; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }

  .login-error {
    margin-top: 1rem;
    font-size: 13px;
    color: var(--coral);
    font-family: -apple-system, sans-serif;
    display: none;
  }

  /* ── Dashboard ── */
  #dashboard { display: none; }

  .topbar {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-logo {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--teal);
    font-family: 'Courier New', monospace;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: -apple-system, sans-serif;
  }

  .topbar-name { font-size: 14px; color: var(--muted); }

  .logout-btn {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: 0.5px solid var(--border2);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: -apple-system, sans-serif;
  }

  .logout-btn:hover { color: var(--text); }

  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--hint);
    font-family: 'Courier New', monospace;
    margin: 2rem 0 .75rem;
  }

  /* ── Metric grid ── */
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 10px;
  }

  .metric-card {
    background: var(--surface2);
    border-radius: 10px;
    padding: .85rem 1rem;
  }

  .metric-label {
    font-size: 11px;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    margin-bottom: 4px;
  }

  .metric-val {
    font-size: 24px;
    font-weight: normal;
    color: var(--text);
  }

  .metric-unit { font-size: 14px; color: var(--muted); margin-left: 2px; }

  .metric-delta {
    font-size: 11px;
    font-family: -apple-system, sans-serif;
    margin-top: 3px;
  }

  .delta-pos { color: var(--teal); }
  .delta-neg { color: var(--coral); }

  /* ── Period tabs ── */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1rem;
  }

  .tab {
    padding: 5px 14px;
    font-size: 12px;
    font-family: -apple-system, sans-serif;
    border: 0.5px solid var(--border2);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }

  .tab.active {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border2);
  }

  /* ── Charts ── */
  .chart-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }

  .chart-title {
    font-size: 13px;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    margin-bottom: 1rem;
  }

  .chart-wrap { position: relative; width: 100%; height: 220px; }

  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── Workout list ── */
  .workout-list { display: flex; flex-direction: column; gap: 8px; }

  .workout-row {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: .85rem 1.1rem;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
  }

  .workout-name {
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .workout-meta {
    font-size: 12px;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    margin-top: 3px;
  }

  .workout-stats {
    display: flex;
    gap: 20px;
    flex-shrink: 0;
  }

  .ws { text-align: right; }
  .ws-val { font-size: 15px; color: var(--text); }
  .ws-lbl { font-size: 10px; color: var(--hint); font-family: -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .05em; }

  .pill {
    display: inline-block;
    font-size: 10px;
    font-family: -apple-system, sans-serif;
    padding: 2px 7px;
    border-radius: 99px;
    margin-top: 5px;
    letter-spacing: .04em;
  }

  .pill-breathe { background: var(--teal-light); color: var(--teal-dark); }
  .pill-warmup  { background: var(--amber-light); color: var(--amber); }
  .pill-cooldown { background: var(--blue-light); color: var(--blue); }
  .pill-drive   { background: var(--surface2); color: var(--muted); }

  /* ── Milestones ── */
  .milestone-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }

  .milestone-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: .85rem 1rem;
  }

  .ms-title { font-size: 14px; color: var(--text); margin-bottom: 2px; }
  .ms-sub { font-size: 12px; color: var(--muted); font-family: -apple-system, sans-serif; margin-bottom: 10px; }

  .progress-bar { height: 4px; background: var(--border2); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--teal); transition: width .5s ease; }

  /* ── Loading / error ── */
  .loading {
    font-size: 13px;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    padding: 2rem 0;
    text-align: center;
  }

  .error-msg {
    font-size: 13px;
    color: var(--coral);
    font-family: -apple-system, sans-serif;
    padding: 1rem 0;
  }

  .page-title {
    font-size: 28px;
    font-weight: normal;
    margin-bottom: .3rem;
  }

  .page-subtitle {
    font-size: 14px;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Hydrow</div>
    <h1 class="login-heading">Your rowing dashboard</h1>
    <p class="login-sub">Sign in with your Hydrow account</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-logo">Hydrow</div>
    <div class="topbar-right">
      <span class="topbar-name" id="topbar-name"></span>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <p class="page-title" id="dash-title">Welcome back</p>
    <p class="page-subtitle" id="dash-subtitle">Loading your stats…</p>

    <!-- Period tabs + metrics -->
    <p class="section-label">Period summary</p>
    <div class="tabs" id="period-tabs">
      <button class="tab active" onclick="switchPeriod('last7', this)">Last 7 days</button>
      <button class="tab" onclick="switchPeriod('last30', this)">Last 30 days</button>
      <button class="tab" onclick="switchPeriod('year1', this)">This year</button>
      <button class="tab" onclick="switchPeriod('lifetime', this)">Lifetime</button>
    </div>
    <div class="metric-grid" id="period-metrics">
      <div class="loading">Loading…</div>
    </div>

    <!-- Charts -->
    <p class="section-label">Recent activity</p>
    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">Meters per session</div>
        <div class="chart-wrap"><canvas id="metersChart" role="img" aria-label="Meters rowed per session">Loading</canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Watts per session</div>
        <div class="chart-wrap"><canvas id="wattsChart" role="img" aria-label="Watts per session">Loading</canvas></div>
      </div>
    </div>

    <!-- Workouts -->
    <p class="section-label">Workout history</p>
    <div class="workout-list" id="workout-list">
      <div class="loading">Loading…</div>
    </div>

    <!-- Milestones -->
    <p class="section-label">Milestones</p>
    <div class="milestone-grid" id="milestones">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:5000/api';
let summaryData = null;
let metersChart = null;
let wattsChart = null;

// ── Utilities ────────────────────────────────────────────────────────────────

function fmtTime(sec) {
  const s = Math.round(Number(sec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function deltaHtml(val) {
  if (val == null || val === 0) return '';
  const cls = val > 0 ? 'delta-pos' : 'delta-neg';
  const sign = val > 0 ? '+' : '';
  return `<div class="metric-delta ${cls}">${sign}${Math.round(val).toLocaleString()} vs prev</div>`;
}

function chartColors() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    teal: '#1D9E75',
    amber: '#BA7517',
    text: dark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.35)',
    grid: dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)',
  };
}

function baseChartOptions(c) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: c.text, font: { size: 10 }, maxRotation: 40, autoSkip: true }, grid: { display: false }, border: { display: false } },
      y: { ticks: { color: c.text, font: { size: 10 } }, grid: { color: c.grid }, border: { display: false } }
    }
  };
}

// ── Auth ─────────────────────────────────────────────────────────────────────

async function checkSession() {
  try {
    const r = await fetch(`${API}/me`);
    if (r.ok) {
      const d = await r.json();
      showDashboard(d.screenName);
      loadAll();
    }
  } catch(e) {}
}

async function doLogin() {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  errEl.style.display = 'none';
  if (!email || !pw) { showErr('Please enter email and password.'); return; }
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const r = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.error || 'Login failed'); btn.disabled = false; btn.textContent = 'Sign in'; return; }
    document.getElementById('password').value = '';
    showDashboard(d.screenName);
    loadAll();
  } catch(e) {
    showErr('Cannot reach server. Is hydrow_server.py running?');
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

function showErr(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function showDashboard(name) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('topbar-name').textContent = name;
  document.getElementById('dash-title').textContent = `Welcome back, ${name.split(' ')[0]}`;
}

async function doLogout() {
  await fetch(`${API}/logout`, { method: 'POST' });
  location.reload();
}

// ── Data loading ─────────────────────────────────────────────────────────────

async function loadAll() {
  await Promise.all([loadSummary(), loadWorkouts()]);
}

async function loadSummary() {
  try {
    const [progR, sumR] = await Promise.all([
      fetch(`${API}/summary`),
      fetch(`${API}/progress-summary`),
    ]);
    const prog = await progR.json();
    const sum  = await sumR.json();

    // Build period lookup
    summaryData = {};
    if (sum.workoutSummaries) {
      sum.workoutSummaries.forEach(p => { summaryData[p.range] = p.stats; });
    }

    const sub = document.getElementById('dash-subtitle');
    const lifetime = summaryData['lifetime'];
    if (lifetime) {
      const days = lifetime.find(s => s.type === 'daysActive')?.value || '?';
      const km   = Math.round((lifetime.find(s => s.type === 'meters')?.value || 0) / 1000);
      sub.textContent = `${days} days on the water · ${km.toLocaleString()} km lifetime`;
    }

    switchPeriod('last7');
    renderMilestones(sum.milestones || []);
  } catch(e) {
    document.getElementById('period-metrics').innerHTML = `<div class="error-msg">Failed to load summary: ${e.message}</div>`;
  }
}

function switchPeriod(key, tabEl) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (tabEl) tabEl.classList.add('active');
  if (!summaryData) return;
  const stats = summaryData[key] || [];
  const get = type => stats.find(s => s.type === type);
  const days = get('daysActive');
  const meters = get('meters');
  const cal = get('calories');
  const time = get('timeWorkedOut');

  document.getElementById('period-metrics').innerHTML = `
    <div class="metric-card">
      <div class="metric-label">Active days</div>
      <div class="metric-val">${days?.value ?? '—'}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Meters</div>
      <div class="metric-val">${meters ? Math.round(meters.value/1000).toLocaleString() : '—'}<span class="metric-unit">km</span></div>
      ${meters?.delta != null ? deltaHtml(meters.delta) : ''}
    </div>
    <div class="metric-card">
      <div class="metric-label">Calories</div>
      <div class="metric-val">${cal ? Number(cal.value).toLocaleString() : '—'}</div>
      ${cal?.delta != null ? deltaHtml(cal.delta) : ''}
    </div>
    <div class="metric-card">
      <div class="metric-label">Time</div>
      <div class="metric-val">${time ? fmtTime(time.value) : '—'}</div>
    </div>
  `;
}

async function loadWorkouts() {
  try {
    const r = await fetch(`${API}/workouts?limit=15`);
    const d = await r.json();
    const workouts = d.workouts || [];
    const videos   = d.videos   || {};
    const athletes = d.athletes || {};

    renderCharts(workouts, videos);
    renderWorkouts(workouts, videos, athletes);
  } catch(e) {
    document.getElementById('workout-list').innerHTML = `<div class="error-msg">Failed to load workouts: ${e.message}</div>`;
  }
}

function getPillClass(categoryId) {
  if ([12].includes(categoryId)) return ['pill-warmup', 'Warm-up'];
  if ([35].includes(categoryId)) return ['pill-cooldown', 'Cool-down'];
  if ([3].includes(categoryId))  return ['pill-breathe', 'Breathe'];
  return ['pill-drive', 'Drive'];
}

function renderWorkouts(workouts, videos, athletes) {
  if (!workouts.length) {
    document.getElementById('workout-list').innerHTML = '<div class="loading">No workouts found.</div>';
    return;
  }
  document.getElementById('workout-list').innerHTML = workouts.slice(0, 10).map(w => {
    const vid  = videos[w.workoutVideoId] || {};
    const stats = w.workoutStats || {};
    const instructor = vid.instructors?.strokeId ? athletes[vid.instructors.strokeId]?.name || '' : '';
    const [pillCls, pillLabel] = getPillClass(vid.categoryId);
    const meters = stats.meters ? Math.round(Number(stats.meters)).toLocaleString() : '—';
    const cal    = stats.calories ?? '—';
    const spm    = stats.strokesPerMinute ?? '—';
    const watts  = stats.watts ?? '—';
    return `
      <div class="workout-row">
        <div>
          <div class="workout-name">${vid.name || 'Workout'}</div>
          <div class="workout-meta">${fmtDate(w.startTime)}${instructor ? ' · ' + instructor : ''}${vid.locationShortName ? ' · ' + vid.locationShortName : ''}</div>
          <span class="pill ${pillCls}">${pillLabel}</span>
        </div>
        <div class="workout-stats">
          <div class="ws"><div class="ws-val">${meters}</div><div class="ws-lbl">meters</div></div>
          <div class="ws"><div class="ws-val">${cal}</div><div class="ws-lbl">cal</div></div>
          <div class="ws"><div class="ws-val">${spm}</div><div class="ws-lbl">spm</div></div>
          <div class="ws"><div class="ws-val">${watts}</div><div class="ws-lbl">watts</div></div>
        </div>
      </div>`;
  }).join('');
}

function renderCharts(workouts, videos) {
  const recent = workouts.slice(0, 10).reverse();
  const c = chartColors();
  const labels = recent.map(w => {
    const vid = videos[w.workoutVideoId] || {};
    return (vid.name || 'Workout').split(' ').slice(0,2).join(' ');
  });
  const metersData = recent.map(w => Math.round(Number(w.workoutStats?.meters || 0)));
  const wattsData  = recent.map(w => w.workoutStats?.watts || 0);

  if (metersChart) metersChart.destroy();
  if (wattsChart) wattsChart.destroy();

  const opts = baseChartOptions(c);

  metersChart = new Chart(document.getElementById('metersChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: metersData, backgroundColor: c.teal, borderRadius: 4 }] },
    options: { ...opts, plugins: { ...opts.plugins, tooltip: { callbacks: { label: ctx => ctx.parsed.y.toLocaleString() + ' m' } } } }
  });

  wattsChart = new Chart(document.getElementById('wattsChart'), {
    type: 'line',
    data: { labels, datasets: [{ data: wattsData, borderColor: c.amber, backgroundColor: c.amber + '22', borderWidth: 2, pointRadius: 3, fill: true, tension: .3 }] },
    options: { ...opts, plugins: { ...opts.plugins, tooltip: { callbacks: { label: ctx => ctx.parsed.y + ' W' } } } }
  });
}

function renderMilestones(milestones) {
  if (!milestones.length) {
    document.getElementById('milestones').innerHTML = '<div class="loading">No milestone data.</div>';
    return;
  }
  document.getElementById('milestones').innerHTML = milestones.map(m => `
    <div class="milestone-card">
      <div class="ms-title">${m.title}</div>
      <div class="ms-sub">${m.subtitle}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(m.percent,100)}%"></div></div>
    </div>`).join('');
}

// ── Enter key on login ────────────────────────────────────────────────────────
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });

// ── Boot ──────────────────────────────────────────────────────────────────────
checkSession();
</script>
</body>
