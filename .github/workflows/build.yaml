name: Build and push container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE: ${{ secrets.DOCKER_USER }}/hydrow-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only push on merges to main, not on PRs from forks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PW }}

      - name: Compute image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEW_IMAGE: docker.io/${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          yq -i '.app.image = strenv(NEW_IMAGE)' helm/values.yaml

          if git diff --quiet helm/values.yaml; then
            echo "helm/values.yaml already up to date"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml

          # Rebase any commits that landed during the build before pushing.
          git pull --rebase --autostash origin main
          git commit -m "ci: bump helm image to ${{ steps.tag.outputs.value }} [skip ci]"
          git push origin HEAD:main
